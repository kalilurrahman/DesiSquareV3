# DesiSquare apps stack — Ghostfolio + Postgres + Redis + WhatsApp bridge + Caddy
# Lives at /opt/desisquare on apps-1. Config via .env (see .env.sample).
name: desisquare

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [ghostfolio, wa-bridge]

  ghostfolio:
    image: ghostfolio/ghostfolio:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?connect_timeout=300&sslmode=prefer
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3333/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  wa-bridge:
    build: ./wa-bridge
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PORT: 3000
    depends_on:
      redis: { condition: service_healthy }

  # --- DesiSquare web app (migrated off Railway) -----------------------------
  # Build the image from your private DesiSquareV2 repo on this VM:
  #   git clone git@github.com:kalilurrahman/DesiSquareV2.git /opt/desisquare/app
  #   (add a deploy key in GitHub repo settings)
  # Then uncomment; adjust the internal port to what the app listens on.
  #
  # desisquare-app:
  #   build: ./app
  #   restart: unless-stopped
  #   env_file: .env
  #   environment:
  #     PORT: 8080

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
