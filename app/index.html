<style>
  /* ===== Design tokens (handoff README §8 — exact values) ===== */
  :root{
    --paper:#F6F5F1; --surface:#FFFFFF; --ink:#1D1D1F; --body:#3C3C40; --dim:#6E6E73;
    --faint:#A4A4A9; --hairline:#E4E2DB; --wash:#F1EFE9;
    --teal:#0F766E; --teal-hover:#0B5F58; --teal-tint:#E8F1EF;
    --saffron:#C05621; --saffron-tint:#F9EDE3;
    --good:#2F7D4F; --good-tint:#E7F2EA; --bad:#B3452E; --bad-tint:#F8E9E4;
    --amber:#8A6D1F; --amber-tint:#F7EFDD;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:13.5px;line-height:1.55}
  a{color:var(--teal);text-decoration:none}
  a:hover{color:var(--teal-hover)}
  input::placeholder,textarea::placeholder{color:var(--faint)}
  button{font-family:inherit}
  @keyframes om-toast{0%{opacity:0;transform:translate(-50%,8px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}

  /* topbar */
  .topbar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,0.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline)}
  .topbar-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;height:54px;padding:0 20px}
  .logo{display:flex;align-items:center;gap:8px;cursor:pointer;flex:none}
  .logo .diamond{width:10px;height:10px;background:var(--saffron);transform:rotate(45deg);display:block}
  .logo .word{font-size:18px;font-weight:700;letter-spacing:-0.02em}
  .search{flex:1;max-width:420px;background:var(--wash);border:1px solid transparent;border-radius:999px;padding:8px 16px;font-size:13px;font-family:inherit;color:var(--ink);outline:none}
  .search:focus{border-color:var(--teal);background:var(--surface)}
  .countrybtn{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--hairline);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
  .countrybtn:hover{border-color:var(--teal)}
  .menu{position:absolute;right:0;top:40px;background:var(--surface);border:1px solid var(--hairline);border-radius:12px;box-shadow:0 8px 28px rgba(29,29,31,0.10);padding:6px;width:230px;z-index:70}
  .menulabel{font-size:10.5px;font-weight:700;letter-spacing:0.08em;color:var(--dim);text-transform:uppercase;padding:8px 10px 4px}
  .crow{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--ink)}
  .crow:hover{background:var(--wash)}
  .crow.on{background:var(--teal-tint);font-weight:700;color:var(--teal-hover)}
  .karma-pill{display:flex;align-items:center;gap:6px;background:var(--teal-tint);border-radius:999px;padding:6px 12px;cursor:pointer;flex:none}

  /* shell */
  .shell{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:216px 1fr;gap:24px;padding:20px 20px 80px;align-items:start}
  .sidebar{position:sticky;top:74px;display:flex;flex-direction:column;gap:20px}
  .navitem{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:9px;font-size:13.5px;font-weight:550;color:var(--body);cursor:pointer;border:1px solid transparent}
  .navitem.on{font-weight:700;background:var(--surface);border:1px solid var(--hairline);color:var(--ink)}
  .sp-row{display:flex;align-items:center;gap:8px;padding:6.5px 12px;border-radius:8px;font-size:13px;color:var(--body);cursor:pointer}
  .sp-row.on{font-weight:700;background:#ECEAE2;color:var(--ink)}
  .seclabel{font-size:10.5px;font-weight:700;letter-spacing:0.08em;color:var(--dim);text-transform:uppercase}

  /* cards + controls */
  .card{background:var(--surface);border:1px solid var(--hairline);border-radius:12px}
  .btn-pri{background:var(--teal);border:1px solid var(--teal);color:#fff;border-radius:8px;padding:6px 14px;font-size:12.5px;font-weight:600;cursor:pointer;flex:none}
  .btn-pri:hover{background:var(--teal-hover);border-color:var(--teal-hover)}
  .btn-ghost{background:var(--surface);border:1px solid var(--hairline);color:var(--ink);border-radius:8px;padding:6px 14px;font-size:12.5px;font-weight:600;cursor:pointer;flex:none}
  .btn-profile:hover{border-color:var(--teal);color:var(--teal)}
  .hovbg-teal:hover{background:var(--teal-hover) !important} /* teal→teal-hover for inline-styled teal surfaces (proto style-hover) */
  .cprompt{flex:1;background:var(--wash);border-radius:999px;padding:9px 16px;font-size:13.5px;color:var(--dim);cursor:text}
  .cprompt:hover{background:#ECEAE2}
  .cbody{border:1px solid var(--hairline);border-radius:10px;padding:10px 12px;font-size:13.5px;font-family:inherit;color:var(--ink);min-height:74px;resize:vertical;outline:none}
  .cbody:focus{border-color:var(--teal)}
  .kbsearch{width:100%;background:var(--surface);border:1px solid var(--hairline);border-radius:12px;padding:13px 18px;font-size:14px;font-family:inherit;color:var(--ink);outline:none}
  .kbsearch:focus{border-color:var(--teal)}
  .comments-link{font-size:12px;color:var(--dim);cursor:pointer}
  .comments-link:hover{color:var(--teal)}
  .pill{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;background:var(--surface);border:1px solid var(--hairline);color:var(--dim);border-radius:999px;padding:3.5px 11px;font-size:12px;font-weight:600;cursor:pointer}
  .pill.on{background:var(--teal-tint);border-color:var(--teal);color:var(--teal-hover);font-weight:700}
  .chip{white-space:nowrap;background:var(--surface);border:1px solid var(--hairline);color:var(--dim);border-radius:999px;padding:4px 13px;font-size:12px;font-weight:600;cursor:pointer}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .toggle{background:var(--surface);border:1px solid var(--hairline);color:var(--dim);border-radius:999px;padding:5px 13px;font-size:12px;font-weight:600;cursor:pointer;flex:none}
  .toggle.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
  .sig{font-size:11px;font-weight:800;border-radius:6px;padding:3px 9px;letter-spacing:0.03em;flex:none}
  .sig-buy{background:var(--good-tint);color:var(--good)} .sig-sell{background:var(--bad-tint);color:var(--bad)}
  .sig-hold{background:var(--amber-tint);color:var(--amber)} .sig-upd{background:var(--wash);color:var(--dim)}
  .maven-badge{background:var(--teal-tint);color:var(--teal-hover);font-size:10.5px;font-weight:700;border-radius:5px;padding:1.5px 7px}
  .wa-badge{background:var(--wash);color:var(--dim);font-size:10.5px;font-weight:600;border-radius:5px;padding:1.5px 7px}
  .livebadge{background:var(--teal-tint);color:var(--teal-hover);font-size:9px;font-weight:800;border-radius:4px;padding:1px 6px;letter-spacing:0.06em;vertical-align:2px}
  .av{border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;flex:none;cursor:pointer}

  /* toast + disclaimer */
  .toast{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:600;border-radius:999px;padding:10px 20px;z-index:100;animation:om-toast 2.6s ease forwards;box-shadow:0 8px 28px rgba(29,29,31,0.25);white-space:nowrap}
  .disclaimer{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(246,245,241,0.96);backdrop-filter:blur(6px);border-top:1px solid var(--hairline);color:var(--dim);font-size:11.5px;text-align:center;padding:7px 12px}

  @media (max-width:1080px){ .rail{display:none} .twocol{grid-template-columns:1fr !important} }
  @media (max-width:820px){ .shell{grid-template-columns:1fr} .sidebar{display:none} }
</style>

/* ---------- LIVE data (all optional — seeded content is the fallback) ---------- */
const LIVE = { ai:false, wa:null, metrics:{}, signals:{} }; // metrics keyed by local model id, signals by maven id
const api = (p, opt) => fetch(p, opt).then(r => r.ok ? r.json() : Promise.reject(new Error(r.status))).catch(() => null);

async function loadLive() {
  const [ai, wa] = await Promise.all([api('/api/ai/health'), api('/api/wa/health')]);
  if (ai && ai.ok) LIVE.ai = true;
  if (wa && wa.ok) LIVE.wa = wa;
  await loadModelsLive();
  safeRender();
}

// models-service (spec: GET /users/:id/models, GET /models/:id/metrics, GET /users/:id/signals)
async function loadModelsLive() {
  for (const mv of MAVENS) {
    // models-service keys users by their pseudonym username (Discourse post.username), e.g. nikhil_cfa
    const uid = encodeURIComponent(String(mv.handle || '').replace(/^@/, '') || mv.id);
    const [ms, sigs] = await Promise.all([
      api('/api/models/users/' + uid + '/models'),
      api('/api/models/users/' + uid + '/signals')
    ]);
    const list = Array.isArray(ms) ? ms : (ms && Array.isArray(ms.models) ? ms.models : []);
    for (const lm of list) {
      const local = MODELS.find(x => x.name.toLowerCase() === String(lm.name || '').toLowerCase());
      if (!local) continue;
      const met = await api('/api/models/models/' + encodeURIComponent(lm.id) + '/metrics');
      if (met && !met.error) LIVE.metrics[local.id] = met;
    }
    const rows = Array.isArray(sigs) ? sigs : (sigs && Array.isArray(sigs.signals) ? sigs.signals : []);
    if (rows.length) LIVE.signals[mv.id] = rows;
  }
}

function safeRender() { // don't yank focus from a mid-typing user
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
  render();
}

/* ---------- helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MINUS = '−';

function fmtPct(v, signed) {
  if (v == null) return '—';
  if (typeof v === 'string') return v;
  const n = Math.abs(v) <= 1.5 ? v * 100 : v; // tolerate fraction or percent units
  const sign = n < 0 ? MINUS : (signed === false ? '' : '+');
  return sign + Math.abs(n).toFixed(1) + '%';
}
function fmtSincePct(v) { // sincePct is percent units per the models-service spec (−1.2 → −1.2%)
  if (v == null) return '—';
  if (typeof v === 'string') return v;
  return (v < 0 ? MINUS : '+') + Math.abs(v).toFixed(1) + '%';
}
function fmtDD(v) {
  if (v == null) return null;
  if (typeof v === 'string') return v;
  const n = Math.abs(v) <= 1.5 ? Math.abs(v) * 100 : Math.abs(v);
  return MINUS + Math.round(n) + '% max DD';
}
function fmtDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return String(iso || '');
  return d.toLocaleString('en-US', { month:'short', day:'numeric' });
}
function sigClass(kind) {
  const k = String(kind || '').split(' ')[0];
  return k === 'BUY' ? 'sig sig-buy' : k === 'SELL' ? 'sig sig-sell' : k === 'HOLD' ? 'sig sig-hold' : 'sig sig-upd';
}
function avatar(color, initials, size, onclick) {
  const s = size || 34;
  return '<div class="av" style="width:' + s + 'px;height:' + s + 'px;background:' + color + ';font-size:' + Math.round(s * 0.36) + 'px"' +
    (onclick ? ' onclick="' + onclick + '"' : '') + '>' + esc(initials) + '</div>';
}
function spark(pts, color) {
  const W = 120, H = 34, max = Math.max.apply(null, pts), min = Math.min.apply(null, pts), span = (max - min) || 1;
  const p = pts.map((v, i) => (i * (W / (pts.length - 1))).toFixed(1) + ',' + (H - 4 - ((v - min) / span) * (H - 8)).toFixed(1)).join(' ');
  return '<svg width="120" height="34" viewBox="0 0 120 34" style="flex:none;display:block"><polyline points="' + p +
    '" style="fill:none;stroke:' + (color || '#0F766E') + ';stroke-width:2;stroke-linejoin:round;stroke-linecap:round"></polyline></svg>';
}

/* ---------- performance / gains (percent-only, eToro "Return %" style) ----------
   Values are percent units (e.g. 14.2 → +14.2%). We format with fmtSincePct — NOT
   fmtPct — because fmtPct's fraction heuristic (|v|<=1.5 → v*100) would corrupt small
   monthly returns like +0.8%. Absolutely no $/₹/£ or absolute amounts here, ever. */
const MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthLabel(ym) {
  const parts = String(ym == null ? '' : ym).split('-');
  const mo = parseInt(parts[1], 10);
  if (!MONTH_ABBR[mo - 1]) return String(ym == null ? '' : ym);
  return MONTH_ABBR[mo - 1] + (parts[0] ? " '" + String(parts[0]).slice(2) : '');
}
function periodsFrom(seed, live) { // normalize seed/live into one shape; live wins when it carries periods
  const src = (live && live.periods) ? live.periods : (seed || {});
  return {
    isLive: !!(live && live.periods),
    overall: src.overall || null,
    yearly: Array.isArray(src.yearly) ? src.yearly : [],
    monthly: Array.isArray(src.monthly) ? src.monthly : []
  };
}
function perfStat(label, pct, sub) {
  const col = (pct == null) ? 'var(--dim)' : (pct >= 0 ? 'var(--good)' : 'var(--bad)');
  return '<div style="min-width:66px">' +
    '<div style="font-size:16px;font-weight:700;color:' + col + '">' + (pct == null ? '—' : fmtSincePct(pct)) + '</div>' +
    '<div style="font-size:10.5px;color:var(--dim);font-weight:600">' + esc(label) + '</div>' +
    (sub ? '<div style="font-size:9.5px;color:var(--faint)">' + esc(sub) + '</div>' : '') +
  '</div>';
}
function perfHeadlinesHTML(pr) {
  const overall = pr.overall || {};
  const thisYear = pr.yearly.length ? pr.yearly.reduce((a, b) => (b.year >= a.year ? b : a)) : null;
  const thisMonth = pr.monthly.length ? pr.monthly.reduce((a, b) => (String(b.ym) >= String(a.ym) ? b : a)) : null;
  return '<div style="display:flex;gap:20px;flex-wrap:wrap">' +
    perfStat('Overall', overall.pct == null ? null : overall.pct, overall.sinceLabel || (overall.annualizedPct != null ? fmtSincePct(overall.annualizedPct) + ' annualized' : '')) +
    perfStat('This Year', thisYear ? thisYear.pct : null, thisYear ? String(thisYear.year) : '') +
    perfStat('This Month', thisMonth ? thisMonth.pct : null, thisMonth ? monthLabel(thisMonth.ym) : '') +
  '</div>';
}
function monthlyStripHTML(monthly) { // last ~12 months as tiny +/- % chips (mini heat row)
  const m = (monthly || []).slice(-12);
  if (!m.length) return '';
  return '<div style="display:flex;gap:3px;flex-wrap:wrap">' +
    m.map(x => {
      const good = (x.pct || 0) >= 0;
      return '<span title="' + esc(monthLabel(x.ym)) + '" style="font-size:9.5px;font-weight:700;white-space:nowrap;border-radius:4px;padding:2px 5px;color:' +
        (good ? 'var(--good)' : 'var(--bad)') + ';background:' + (good ? 'var(--good-tint)' : 'var(--bad-tint)') + '">' + fmtSincePct(x.pct) + '</span>';
    }).join('') +
  '</div>';
}
function yearlyBarsHTML(yearly) { // calendar-year % returns as simple bars
  const ys = (yearly || []).slice().sort((a, b) => a.year - b.year);
  if (!ys.length) return '';
  const maxAbs = Math.max.apply(null, ys.map(y => Math.abs(y.pct || 0))) || 1;
  return '<div style="display:flex;gap:16px;align-items:flex-end;padding-top:2px">' +
    ys.map(y => {
      const good = (y.pct || 0) >= 0;
      const h = Math.max(6, Math.round(Math.abs(y.pct || 0) / maxAbs * 44));
      return '<div style="display:flex;flex-direction:column;align-items:center;gap:3px">' +
        '<div style="font-size:10.5px;font-weight:700;color:' + (good ? 'var(--good)' : 'var(--bad)') + '">' + fmtSincePct(y.pct) + '</div>' +
        '<div style="width:28px;height:' + h + 'px;border-radius:4px 4px 0 0;background:' + (good ? 'var(--teal)' : 'var(--bad)') + '"></div>' +
        '<div style="font-size:10px;color:var(--dim);font-weight:600">' + esc(String(y.year)) + '</div>' +
      '</div>';
    }).join('') +
  '</div>';
}
function perfSubLabel(t) {
  return '<div style="font-size:10.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:0.05em;margin-top:12px;margin-bottom:5px">' + esc(t) + '</div>';
}
function perfBlockHTML(pr, opts) {
  opts = opts || {};
  if (!pr || (!pr.overall && !pr.yearly.length && !pr.monthly.length)) {
    return '<div style="font-size:12.5px;color:var(--dim)">No tracked performance yet.</div>';
  }
  return (opts.title ? '<div class="seclabel">' + esc(opts.title) + (pr.isLive ? ' <span class="livebadge">LIVE</span>' : '') + '</div><div style="height:10px"></div>' : '') +
    perfHeadlinesHTML(pr) +
    (pr.monthly.length ? perfSubLabel('Monthly returns · last 12') + monthlyStripHTML(pr.monthly) : '') +
    (pr.yearly.length ? perfSubLabel('By calendar year') + yearlyBarsHTML(pr.yearly) : '') +
    (opts.note === false ? '' : '<div style="font-size:11px;color:var(--faint);margin-top:11px;line-height:1.5">Return&nbsp;% only — dollar values are never shown. Educational, not investment advice.</div>');
}

let toastTimer = null;
function toast(t) {
  const host = document.getElementById('toasthost');
  host.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = t;
  host.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { host.innerHTML = ''; }, 2600);
}

/* ---------- hash router ---------- */
let suppressHash = false;
function hashFor() {
  switch (state.view) {
    case 'feed': return state.space && state.space !== 'all' ? '#/feed/' + state.space : '#/';
    case 'post': return '#/post/' + state.activePost;
    case 'maven': return '#/maven/' + state.activeMaven;
    case 'search': return '#/search/' + encodeURIComponent(state.q || '');
    default: return '#/' + state.view;
  }
}
function applyHash() {
  const h = location.hash.replace(/^#\/?/, '');
  const [seg, arg] = h.split('/');
  if (!seg || seg === 'feed') { state.view = 'feed'; state.space = (seg === 'feed' && arg && SPACES.some(s => s.id === arg)) ? arg : 'all'; }
  else if (seg === 'post' && state.posts.some(p => p.id === arg)) { state.view = 'post'; state.activePost = arg; }
  else if (seg === 'maven' && MAVENS.some(m => m.id === arg)) { state.view = 'maven'; state.activeMaven = arg; }
  else if (seg === 'search') { state.view = 'search'; try { state.q = arg ? decodeURIComponent(arg) : ''; } catch (e) { state.q = arg || ''; } }
  else if (['home','directory','kb','me','settings','mod'].includes(seg)) state.view = seg;
  else state.view = 'feed';
}
window.addEventListener('hashchange', () => {
  if (suppressHash) { suppressHash = false; return; }
  state.countryOpen = false; state.fbFor = null;
  applyHash(); render(); window.scrollTo(0, 0);
});

/* ---------- app actions ---------- */
const A = {
  go(view, extra) {
    Object.assign(state, { countryOpen:false, fbFor:null }, extra || {});
    state.view = view;
    const h = hashFor();
    if (location.hash !== h) { suppressHash = true; location.hash = h; }
    render(); window.scrollTo(0, 0);
  },
  openPost(id)   { A.go('post',  { activePost: id }); },
  openMaven(id)  { A.go('maven', { activeMaven: id }); },
  pickSpace(id)  { A.go('feed',  { space: id }); },

  /* top bar */

    if (state.view === 'search') { // live-filter in place; keep URL in sync without spamming history
      try { history.replaceState(null, '', hashFor()); } catch (e) {}

    } else if (v.trim().length >= 2) { // typing routes into search results
      state.searchTab = 'all'; A.go('search');
    }
  },
  searchEnter() { state.searchTab = 'all'; A.go('search', { q: state.q }); },
  pickSearchTab(t) { state.searchTab = t; render(); },

  openKb() { A.go('kb', { kbQ: state.q }); },

/* ---------- dedup-as-you-type (debounced ≥300 ms; ai-service when up, seed KB otherwise) ---------- */
let dedupTimer = null, dedupSeq = 0;
function scheduleDedup() { clearTimeout(dedupTimer); dedupTimer = setTimeout(runDedup, 320); }
async function runDedup() {
  const t = state.cTitle.trim(); const seq = ++dedupSeq;
  let dupes = [], live = false;
  if (t.length > 3) {
    if (LIVE.ai) {
      const r = await api('/api/ai/ask', {
        method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ question: t })
      });
      if (seq !== dedupSeq) return; // stale response
      if (r && Array.isArray(r.citations)) {
        dupes = r.citations.filter(c => (c.score || 0) >= 0.25).slice(0, 2).map(c => ({ title: c.title || c.id }));
        live = dupes.length > 0;
      }
    }
    if (!dupes.length) {
      dupes = KB.filter(k => k.keys.some(x => t.toLowerCase().includes(x))).slice(0, 2).map(k => ({ title: k.title }));
    }
  }
  if (seq !== dedupSeq) return;
  state.dupes = dupes; state.dupesLive = live;
  const box = document.getElementById('dupbox');
  if (box) box.outerHTML = dupboxHTML();
}
function dupboxHTML() {
  if (!state.dupes.length) return '<div id="dupbox"></div>';
  return '<div id="dupbox" style="border:1px solid #EAD9A8;background:#FCF7EA;border-radius:10px;padding:10px 12px">' +
    '<div style="font-size:12px;font-weight:700;color:var(--amber)">Already answered? Upvote instead of re-asking — one answer should help many.' +
    (state.dupesLive ? ' <span class="livebadge">LIVE</span>' : '') + '</div>' +
    state.dupes.map(d =>
      '<div style="display:flex;align-items:center;gap:8px;margin-top:7px">' +
        '<span style="flex:1;font-size:12.5px;color:var(--ink)">' + esc(d.title) + '</span>' +
        '<button onclick="A.upvoteExisting()" style="background:#FFFFFF;border:1px solid #8A6D1F;color:#8A6D1F;border-radius:7px;padding:3px 10px;font-size:11.5px;font-weight:600;cursor:pointer">Upvote existing</button>' +
      '</div>').join('') +
    '</div>';
}

function modelCardHTML(m) {
  const on = !!state.followingModels[m.id];
  const live = LIVE.metrics[m.id];
  let cagr = m.cagr, since = m.since, vsSpy = m.vsSpy, vsGood = m.vsGood, dd = m.dd, pts = m.pts;
  const pr = periodsFrom(m.periods, live); // percent-only Monthly / Yearly / Overall — live wins, else seeded
  if (live) {
    cagr = fmtPct(live.cagr);
    vsSpy = fmtPct(live.vsBenchmark);
    vsGood = String(vsSpy).indexOf(MINUS) !== 0 && String(vsSpy).indexOf('-') !== 0;
    dd = fmtDD(live.maxDrawdown) || m.dd;
    if (live.since) since = 'since ' + fmtDate(live.since) + (isNaN(new Date(live.since)) ? '' : ' ' + new Date(live.since).getFullYear());
    if (Array.isArray(live.series) && live.series.length >= 2) {
      const nums = live.series.map(x => typeof x === 'number' ? x : (x && (x.value != null ? x.value : (x.equity != null ? x.equity : x.close)))).filter(x => typeof x === 'number');
      if (nums.length >= 2) {
        const step = Math.max(1, Math.floor(nums.length / 15));
        pts = nums.filter((_, i) => i % step === 0 || i === nums.length - 1);
      }
    }
  }
  return '<div style="border:1px solid var(--hairline);border-radius:10px;padding:13px 15px;margin-top:10px">' +
    '<div style="display:flex;align-items:center;gap:10px">' +
      '<div style="flex:1;min-width:0">' +
        '<div style="font-size:14px;font-weight:700">' + esc(m.name) + (live ? ' <span class="livebadge">LIVE</span>' : '') + '</div>' +
        '<div style="font-size:12px;color:var(--dim);margin-top:1px">' + esc(m.strategy) + '</div>' +
      '</div>' +
      spark(pts) +
    '</div>' +
    '<div style="display:flex;gap:18px;margin-top:10px;flex-wrap:wrap">' +
      '<div><div style="font-size:15px;font-weight:700;color:var(--good)">' + esc(cagr) + '</div><div style="font-size:10.5px;color:var(--dim)">CAGR ' + esc(since) + '</div></div>' +
      '<div><div style="font-size:15px;font-weight:700;color:' + (vsGood ? 'var(--good)' : 'var(--bad)') + '">' + esc(vsSpy) + '</div><div style="font-size:10.5px;color:var(--dim)">vs S&amp;P 500</div></div>' +
      '<div><div style="font-size:15px;font-weight:700">' + esc(m.risk) + '</div><div style="font-size:10.5px;color:var(--dim)">risk · ' + esc(dd) + '</div></div>' +
      '<span style="flex:1"></span>' +
      followBtn('followModel', m.id, on, 'Following ✓', 'Follow model') +
    '</div>' +
    ((pr.overall || pr.yearly.length || pr.monthly.length) ?
      '<div style="border-top:1px dashed var(--hairline);margin-top:10px;padding-top:10px">' +
        '<div style="font-size:10.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px">Return % · monthly / yearly / overall' + (pr.isLive ? ' <span class="livebadge">LIVE</span>' : '') + '</div>' +
        perfBlockHTML(pr, { note:false }) +
      '</div>' : '') +
    '<div style="font-size:11.5px;color:var(--dim);border-top:1px dashed var(--hairline);margin-top:10px;padding-top:8px">' + esc(m.note) + ' · <b style="color:var(--ink)">' + m.followers.toLocaleString('en-US') + '</b> following</div>' +

function signalRowsHTML(m) {
  const live = LIVE.signals[m.id];

      const since = fmtSincePct(r.sincePct);
      return {
        date: r.stampedAt ? fmtDate(r.stampedAt) : (r.date || ''),
        kind: r.kind || 'UPDATE',
        note: r.note || (r.instrument ? String(r.instrument) : ''),
        since, good: typeof r.sincePct === 'number' ? r.sincePct >= 0 : true

    '<div style="display:grid;grid-template-columns:52px 68px minmax(0,1fr) 56px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--wash);font-size:12.5px">' +

/* ---------- search ---------- */
function scoreMatch(text, q) { // returns -1 for no match; higher = better (earlier / prefix / word-boundary)
  const t = String(text == null ? '' : text).toLowerCase();
  const i = t.indexOf(q);
  if (i < 0) return -1;
  let s = 100 - Math.min(i, 90);
  if (i === 0) s += 50;
  const re = new RegExp('\\b' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (re.test(t)) s += 20;
  return s;
}
function searchResults(q) {
  const query = String(q || '').trim().toLowerCase();
  const best = function () { let m = -1; for (let i = 0; i < arguments.length; i++) m = Math.max(m, scoreMatch(arguments[i], query)); return m; };

  const comms = [];
  Object.keys(state.communities).forEach(cc => {
    (state.communities[cc] || []).forEach(c => {
      const sc = best(c.name, c.desc);
      if (sc >= 0) comms.push({ sc, kind:'community', country:cc, id:c.id, name:c.name, desc:c.desc, type:c.type });
    });
  });
  SPACES.filter(s => s.id !== 'all').forEach(sp => {
    const sc = scoreMatch(sp.name, query);
    if (sc >= 0) comms.push({ sc, kind:'space', id:sp.id, name:sp.name, desc:'Space in US Investment · ' + (sp.count || 0) + ' posts', type:'space' });
  });
  comms.sort((a, b) => b.sc - a.sc);

  const posts = [];
  state.posts.forEach(p => {
    const sc = best(p.title, p.body, p.bodyFull);
    if (sc >= 0) posts.push({ sc, p });
  });
  posts.sort((a, b) => b.sc - a.sc);

  const comments = [];
  state.posts.forEach(p => {
    (p.comments || []).forEach(c => {
      const sc = best(c.text, c.author);
      if (sc >= 0) comments.push({ sc, c, p });
    });
  });
  comments.sort((a, b) => b.sc - a.sc);

  const profiles = [];
  MAVENS.forEach(m => {
    const sc = best(m.name, m.handle, m.blurb, m.cred, (m.special || []).join(' '));
    if (sc >= 0) profiles.push({ sc, kind:'maven', id:m.id, name:m.name, handle:m.handle, sub:m.cred, av:m.av });
  });
  (function () {
    const sc = best('quiet_lotus', 'peer', 'member');
    if (sc >= 0) profiles.push({ sc, kind:'self', name:'quiet_lotus', handle:'@quiet_lotus', sub:'You · US Investment member', av:AV.plum });
  })();
  profiles.sort((a, b) => b.sc - a.sc);

  const kb = [];
  KB.forEach(k => {
    const sc = best(k.title, k.space, (k.keys || []).join(' '));
    if (sc >= 0) kb.push({ sc, k });
  });
  kb.sort((a, b) => b.sc - a.sc);

  return { comms, posts, comments, profiles, kb };
}

    '</div>' +
    '<div style="font-size:11.5px;color:var(--dim);margin-top:5px">' + k.helpful + ' found this helpful · updated ' + esc(k.updated) + '</div>' +
  '</div>';
}
function searchResultCards(R, tab) {
  const out = [];
  const groupLabel = t => '<div class="seclabel" style="padding:14px 4px 2px">' + esc(t) + '</div>';
  if ((tab === 'all' || tab === 'communities') && R.comms.length) {
    if (tab === 'all') out.push(groupLabel('Communities'));
    R.comms.forEach(c => out.push(communityResultHTML(c)));
  }
  if ((tab === 'all' || tab === 'posts') && R.posts.length) {
    if (tab === 'all') out.push(groupLabel('Posts'));
    R.posts.forEach(x => out.push(postResultHTML(x.p)));
  }
  if ((tab === 'all' || tab === 'comments') && R.comments.length) {
    if (tab === 'all') out.push(groupLabel('Comments'));
    R.comments.forEach(x => out.push(commentResultHTML(x.c, x.p)));
  }
  if ((tab === 'all' || tab === 'profiles') && R.profiles.length) {
    if (tab === 'all') out.push(groupLabel('Profiles'));
    R.profiles.forEach(pr => out.push(profileResultHTML(pr)));
  }
  if (tab === 'all' && R.kb.length) { // KB kept reachable from the All results
    out.push(groupLabel('Knowledge base'));
    R.kb.forEach(x => out.push(kbResultHTML(x.k)));
  }
  return out.join('');
}
function searchTipsHTML(q) {
  return '<div style="border:1px dashed var(--hairline);border-radius:12px;padding:22px;text-align:center">' +
    '<div style="font-size:14px;font-weight:650">' + (q ? 'No matches for “' + esc(q) + '”' : 'Search DesiSquare') + '</div>' +
    '<div style="font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:8px;max-width:460px;margin-left:auto;margin-right:auto">Try a ticker like <b>VTI</b>, a topic like <b>FCNR</b> or <b>DTAA</b>, a space like <b>Watercooler</b>, or a member name like <b>Nikhil</b>.</div>' +
    '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px">' +
      '<button class="btn-ghost" onclick="A.go(\'kb\')">Browse knowledge base</button>' +
      '<button class="btn-ghost" onclick="A.go(\'directory\')">Expert directory</button>' +
    '</div>' +
  '</div>';
}
function searchView() {
  const q = String(state.q || '').trim();
  const tab = state.searchTab || 'all';
  const head = '<div style="padding:2px 4px 12px">' +
    '<div style="font-size:19px;font-weight:700;letter-spacing:-0.01em">Search</div>' +
    '<div style="font-size:13px;color:var(--dim);margin-top:3px">' + (q ? 'Results for “' + esc(q) + '” across communities, posts, comments and profiles.' : 'Search communities, posts, comments and profiles — type in the bar above.') + '</div>' +
  '</div>';
  if (!q) return '<div style="max-width:820px">' + head + searchTipsHTML('') + '</div>';
  const R = searchResults(q);
  const counts = {
    all: R.comms.length + R.posts.length + R.comments.length + R.profiles.length,
    communities: R.comms.length, posts: R.posts.length, comments: R.comments.length, profiles: R.profiles.length
  };
  const tabs = [['all','All',counts.all],['communities','Communities',counts.communities],['posts','Posts',counts.posts],['comments','Comments',counts.comments],['profiles','Profiles',counts.profiles]];
  const tabsHTML = '<div style="display:flex;gap:6px;flex-wrap:wrap;padding:2px 4px 12px">' +
    tabs.map(t => '<button class="chip' + (tab === t[0] ? ' on' : '') + '" onclick="A.pickSearchTab(\'' + t[0] + '\')">' + t[1] + ' <span style="opacity:0.7">' + t[2] + '</span></button>').join('') +
  '</div>';
  const hasAny = tab === 'all' ? (counts.all + R.kb.length) > 0 : counts[tab] > 0;
  return '<div style="max-width:820px">' + head + tabsHTML +
    (hasAny ? '<div style="display:flex;flex-direction:column;gap:10px">' + searchResultCards(R, tab) + '</div>' : searchTipsHTML(q)) +
  '</div>';
}

/* ---------- chrome renderers ---------- */
function renderCountry() {
  const country = COUNTRIES.find(c => c.code === state.country) || COUNTRIES[0];
  const wrap = document.getElementById('countrywrap');
  wrap.innerHTML =
    '<button class="countrybtn" onclick="A.toggleCountry()"><span>' + country.code + '</span><span style="color:var(--dim);font-size:10px">▾</span></button>' +
    (state.countryOpen
      ? '<div class="menu">' +
          '<div class="menulabel">Your NRI home base</div>' +
          COUNTRIES.map(c => {
            const n = (state.communities[c.code] || []).length;
            return '<div class="crow' + (c.code === state.country ? ' on' : '') + '" onclick="A.pickCountry(\'' + c.code + '\')">' +
              '<span style="font-size:16px">' + c.flag + '</span><span style="flex:1">' + c.name + '</span>' +
              '<span style="font-size:11.5px;color:var(--dim)">' + n + (n === 1 ? ' community' : ' communities') + '</span></div>';
          }).join('') +
          '<div style="font-size:11px;color:var(--dim);padding:8px 10px;border-top:1px solid var(--wash);margin-top:4px">Each country has its own communities.</div>' +
        '</div>'
      : '');
}

function renderSidebar() {
  const v = state.view;
  const navOn = { feed: v === 'feed' || v === 'post', home: v === 'home', dir: v === 'directory' || v === 'maven', kb: v === 'kb', me: v === 'me', set: v === 'settings', mod: v === 'mod' };
  const modCount = state.modQueue.filter(x => x.status === 'pending').length;
  const waLive = !!LIVE.wa;
  document.getElementById('sidebar').innerHTML =
    '<div style="display:flex;flex-direction:column;gap:2px">' +
      '<div class="navitem' + (navOn.feed ? ' on' : '') + '" onclick="A.go(\'feed\')">Feed</div>' +
      '<div class="navitem' + (navOn.home ? ' on' : '') + '" onclick="A.go(\'home\')">Communities</div>' +
      '<div class="navitem' + (navOn.dir ? ' on' : '') + '" onclick="A.go(\'directory\')">Expert directory</div>' +
      '<div class="navitem' + (navOn.kb ? ' on' : '') + '" onclick="A.go(\'kb\')">Knowledge base</div>' +
      '<div class="navitem' + (navOn.me ? ' on' : '') + '" onclick="A.go(\'me\')">My activity</div>' +
      '<div class="navitem' + (navOn.set ? ' on' : '') + '" onclick="A.go(\'settings\')">Settings</div>' +
      '<div class="navitem' + (navOn.mod ? ' on' : '') + '" onclick="A.go(\'mod\')"><span style="flex:1">Moderation</span><span style="background:var(--saffron-tint);color:var(--saffron);font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px">' + modCount + '</span></div>' +
    '</div>' +
    '<div>' +
      '<div class="seclabel" style="padding:0 12px 6px">Spaces · US Investment</div>' +
      '<div style="display:flex;flex-direction:column;gap:1px">' +
        SPACES.map(sp =>
          '<div class="sp-row' + (state.space === sp.id && (v === 'feed') ? ' on' : '') + '" onclick="A.pickSpace(\'' + sp.id + '\')"><span style="flex:1">' + esc(sp.name) + '</span><span style="font-size:11px;color:var(--faint)">' + sp.count + '</span></div>').join('') +
      '</div>' +
    '</div>' +
    '<div class="card" style="margin:0 4px;border-radius:10px;padding:10px 12px;cursor:pointer" onclick="A.go(\'settings\')" onmouseover="this.style.borderColor=\'#0F766E\'" onmouseout="this.style.borderColor=\'#E4E2DB\'">' +
      '<div style="display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600"><span style="width:7px;height:7px;border-radius:50%;background:var(--good);display:block"></span>WhatsApp connected' + (waLive ? ' <span class="livebadge">LIVE</span>' : '') + '</div>' +
      '<div style="font-size:11px;color:var(--dim);margin-top:3px;line-height:1.4">Chat from WhatsApp, it lands here. Manage in Settings.</div>' +
    '</div>';
}

const VIEWS = { feed: feedView, home: homeView, post: postView, maven: mavenView, directory: directoryView, kb: kbView, me: meView, settings: settingsView, mod: modView, search: searchView };

function render() {
  renderCountry();
  renderSidebar();
  document.getElementById('main').innerHTML = (VIEWS[state.view] || feedView)();
  // keep the top-bar search box in sync with state.q (but never fight a mid-type user)
  const topq = document.getElementById('topq');
  if (topq && document.activeElement !== topq && topq.value !== (state.q || '')) topq.value = state.q || '';
  // persistent "not investment advice" disclaimer on content surfaces
  const showDisc = ['feed','post','maven','directory','search'].includes(state.view);
  document.getElementById('disclaimer').style.display = showDisc ? 'block' : 'none';
}

/* ---------- boot ---------- */
applyHash();
render();
loadLive();
</script>
</body>
</html>
