<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DesiSquare — where desi money questions get trusted answers</title>
  <meta name="description" content="A minimalist, trust-driven investment community for the desi diaspora — on the web and on WhatsApp. Pseudonymous by default.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='8' y='8' width='16' height='16' rx='2' transform='rotate(45 16 16)' fill='%23C05621'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app"></div>
  <!-- Toasts live outside #app so their auto-dismiss never re-renders the app (which would
       steal focus/caret from whatever the user is typing). aria-live is scoped to here. -->
  <div id="toast-host" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
